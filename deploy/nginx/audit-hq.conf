# nginx vhost cho Audit-HQ đề án (static HTML).
# Pattern theo data-hub deploy: TLS + Let's Encrypt + basic-auth bảo vệ draft.
#
# Cài đặt:
#   sudo install -m 0644 deploy/nginx/audit-hq.conf /etc/nginx/sites-available/
#   sudo ln -s ../sites-available/audit-hq.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Trước đó:
#   sudo mkdir -p /home/tinsu/audit-hq && sudo chown tinsu:tinsu /home/tinsu/audit-hq
#   sudo apt install apache2-utils  # for htpasswd
#   sudo htpasswd -c /etc/nginx/htpasswd-audit-hq <username>
#   sudo certbot certonly --webroot -w /var/www/letsencrypt -d audit-hq.sgnai.dev

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name audit-hq.sgnai.dev;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS static
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name audit-hq.sgnai.dev;

    ssl_certificate     /etc/letsencrypt/live/audit-hq.sgnai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audit-hq.sgnai.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /home/tinsu/audit-hq;
    index index.html;

    # Basic auth bảo vệ draft (commercially sensitive)
    auth_basic           "Audit-HQ DRAFT — ủy quyền cần thiết";
    auth_basic_user_file /etc/nginx/htpasswd-audit-hq;

    location / {
        try_files $uri $uri/ =404;
        # Cache nhẹ vì file thay đổi liên tục trong giai đoạn draft
        expires 5m;
        add_header Cache-Control "private, must-revalidate";
    }

    access_log /var/log/nginx/audit-hq.access.log;
    error_log  /var/log/nginx/audit-hq.error.log;
}
