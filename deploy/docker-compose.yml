services:
  audit-hq:
    image: nginx:1.27-alpine
    container_name: audit-hq
    restart: unless-stopped
    ports:
      - "127.0.0.1:8757:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
